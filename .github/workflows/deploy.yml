name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Получение исходного кода
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. Настройка среды Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      # 3. Установка зависимостей
      - name: Install dependencies
        run: npm ci
      
      # 4. Сборка приложения
      - name: Build application
        run: npm run build
      
      # 5. Сборка Docker-образа
      - name: Build Docker image
        run: docker build -t lab19-app -f Dockerfile.optimized .
      
      # 6. Отправка образа в Docker Hub (требует secrets)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Tag and push Docker image
        run: |
          docker tag lab19-app ${{ secrets.DOCKERHUB_USERNAME }}/lab19-app:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/lab19-app:latest
      
      # 7. Развертывание на Heroku (требует secrets)
      - name: Deploy to Heroku
        uses: akhileshns/heroku-deploy@v3.12.12
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ secrets.HEROKU_APP_NAME }}
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
          docker: true